name: Check App on Every Push
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-level-gaming
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-level-gaming/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Check if code has errors
        run: npx tsc --noEmit || echo "No TypeScript check, skipping"
